name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # This runner is disposable, unlike a developer's own machine, so the
      # full suite (including tests that click/type/scroll for real) runs
      # here by default. See tests/conftest.py.
      OPENREACH_ALLOW_LIVE_INPUT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install openreach
        run: pip install -e ".[dev]"
      - name: Install Xvfb (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run tests (Linux, headless)
        if: runner.os == 'Linux'
        run: xvfb-run -a pytest -v
      - name: Run tests (macOS/Windows, native display)
        if: runner.os != 'Linux'
        run: pytest -v
