[project]
name = "openreach"
version = "0.1.0"
description = "Open-source, cross-OS computer-use tool for any LLM harness"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pyautogui>=0.9.54",
    "mss>=9.0.1",
    "pillow>=10.0.0",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "python-xlib>=0.33; sys_platform == 'linux'",
]

[project.scripts]
openreach = "openreach.cli:main"

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10"]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "pytesseract>=0.3.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openreach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live_input: sends real mouse/keyboard input to the desktop running the test; skipped locally unless OPENREACH_ALLOW_LIVE_INPUT=1 (see tests/conftest.py)",
]
